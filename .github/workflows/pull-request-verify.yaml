name: Pull request verification

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github-neuland-contracts
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # CI analysis cannot run while SonarCloud Automatic Analysis is enabled.
      - name: Disable SonarCloud Automatic Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/sonar-autoscan.body -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" -X POST \
            "https://sonarcloud.io/api/autoscan/activation" \
            -d "projectKey=neuland-ingolstadt_app-food&enable=false")
          echo "autoscan disable HTTP ${code}"
          cat /tmp/sonar-autoscan.body || true
          if [[ "${code}" == "200" || "${code}" == "204" ]]; then
            exit 0
          fi
          if grep -qiE 'already|not enabled|disabled' /tmp/sonar-autoscan.body 2>/dev/null; then
            echo "Automatic Analysis already disabled"
            exit 0
          fi
          echo "::error::Failed to disable SonarCloud Automatic Analysis (HTTP ${code})"
          exit 1

      - name: Run tests and SonarCloud analysis
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
