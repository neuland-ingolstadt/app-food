#
# Quarkus
#
quarkus.application.name=app-food
quarkus.http.port=8080

quarkus.management.enabled=true
quarkus.management.port=9002

quarkus.smallrye-health.root-path=/
quarkus.smallrye-health.liveness-path=livez
quarkus.smallrye-health.readiness-path=readyz
quarkus.smallrye-health.startup-path=startedz

#
# Index generated OpenAPI server interfaces so Quarkus REST discovers the @Path / HTTP method
# annotations declared on those interfaces.
#
quarkus.index-dependency.backend-food-api.group-id=app.neuland
quarkus.index-dependency.backend-food-api.artifact-id=backend-food-api

#
# Cache
# Dev/test: process local in-memory cache.
# Prod: Valkey/Redis, set QUARKUS_REDIS_HOSTS (e.g. redis://:password@valkey:6379).
# The service degrades gracefully if the cache is unavailable, so Redis is not part of readiness.
#
food.cache.in-memory=true
%prod.food.cache.in-memory=false
food.cache.ttl-seconds=1800

quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false
quarkus.redis.health.enabled=false

#
# Cache warmup (cache TTL is 30 minutes)
#
food.warmup.every=25m
food.warmup.delay=10s
%test.food.warmup.every=off

#
# Menu sources
# Mensa data is downloaded live from max-manager.de (Studierendenwerk Erlangen-Nuernberg).
#
food.mensa.ingolstadt.url=https://www.max-manager.de/daten-extern/sw-erlangen-nuernberg/xml/mensa-ingolstadt.xml
food.mensa.neuburg.url=https://www.max-manager.de/daten-extern/sw-erlangen-nuernberg/xml/cafeteria-neuburg.xml
food.canisius.pdf-url=http://www.canisiusstiftung.de/wp-content/uploads/Speiseplan/speiseplan.pdf
food.reimanns.graphql-url=https://reimanns-api.neuland.app/graphql

#
# Translation (DeepL). Without an API key the German name is used as English name.
# Set FOOD_DEEPL_API_KEY (and optionally FOOD_DEEPL_SERVER_URL) to enable translations.
#
food.deepl.enabled=true
%dev.food.deepl.enabled=false
%test.food.deepl.enabled=false

#
# Logging
#
%prod.quarkus.log.level=INFO
